name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm run build
      - run: npm test
      - run: npm run check:demo
      - run: npm run build:power
      - run: npm run test:power
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
